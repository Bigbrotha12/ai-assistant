name: ci-cd

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  flutter-checks:
    name: Flutter analyze + tests
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter analyze + tests
        run: |
          command -v flutter >/dev/null || {
            echo "flutter not found on the self-hosted runner. Install the project's Flutter SDK and add it to PATH." >&2
            exit 1
          }
          flutter pub get
          flutter analyze
          flutter test

  build-and-deploy:
    name: Test, build, push to GHCR, roll out to k3s
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Server tests + typecheck
        working-directory: server
        env:
          BETTER_AUTH_SECRET: ci-test-only-secret-0123456789abcdef0123456789abcdef
          BETTER_AUTH_URL: http://localhost:17600
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Build image
        run: |
          SHA="${GITHUB_SHA}"
          podman build \
            -t ai-assistant-gateway:${SHA} \
            -t ai-assistant-gateway:latest \
            -f Dockerfile .

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login --password-stdin -u bigbrotha12 ghcr.io

      - name: Push to GHCR
        run: |
          SHA="${GITHUB_SHA}"
          podman push ai-assistant-gateway:${SHA} docker://ghcr.io/bigbrotha12/ai-assistant-gateway:${SHA}
          podman push ai-assistant-gateway:latest docker://ghcr.io/bigbrotha12/ai-assistant-gateway:latest

      - name: Roll out to k3s
        run: |
          SHA="${GITHUB_SHA}"
          IMG="ghcr.io/bigbrotha12/ai-assistant-gateway:${SHA}"
          kubectl set image deployment/ai-assistant -n productivity \
            ai-assistant="${IMG}" migrate="${IMG}"
          kubectl rollout status deployment/ai-assistant -n productivity --timeout=180s
